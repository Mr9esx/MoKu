server {
    listen 80;
    listen [::]:80;
    server_name moku.miaoplus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://moku.miaoplus.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moku.miaoplus.com;
    root /var/www/moku/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/moku.miaoplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moku.miaoplus.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MokuSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    access_log /var/log/nginx/moku.access.log main;
    error_log /var/log/nginx/moku.error.log warn;
}
